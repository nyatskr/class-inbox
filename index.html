<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f6f8">
<title>课堂资料收件箱</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="tb-left">
      <h1 id="pageTitle">今日</h1>
      <p id="pageSub" class="sub">—</p>
    </div>
    <div id="tbRight" class="tb-right"></div>
  </header>
  <main id="view"></main>
  <nav class="tabbar">
    <button class="tab active" data-tab="today"><span class="ico">▦</span>今日</button>
    <button class="tab" data-tab="schedule"><span class="ico">▤</span>课表</button>
    <button class="tab" data-tab="library"><span class="ico">▧</span>资料</button>
    <button class="tab" data-tab="history"><span class="ico">▣</span>历史</button>
    <button class="tab" data-tab="settings"><span class="ico">◎</span>我的</button>
  </nav>
</div>

<div id="modal" class="modal" hidden>
  <div class="modal-card"><div id="modalBody"></div></div>
</div>
<div id="toast" class="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
